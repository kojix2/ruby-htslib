name: Documentation and paper

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Generate document
        run: gem install -N yard && yard doc
      - name: Generate English preprint LaTeX
        uses: xuanxu/publishing-artifacts-action@main
        with:
          journal: joss
          paper-path: paper/ruby-htslib.md
          args: "-o preprint"
      - name: Build English preprint PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.preprint.tex
          working_directory: paper
          os: debian
      - name: Rename English PDF
        run: mv paper/paper.preprint.pdf paper/ruby-htslib.pdf
      - name: Generate Japanese preprint LaTeX
        uses: xuanxu/publishing-artifacts-action@main
        with:
          journal: joss
          paper-path: paper/ruby-htslib.ja.md
          args: "-o preprint"
      - name: Build Japanese preprint PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.preprint.tex
          working_directory: paper
          os: debian
          latexmk_use_lualatex: true
          extra_system_packages: fonts-noto-cjk
      - name: Rename Japanese PDF
        run: mv paper/paper.preprint.pdf paper/ruby-htslib-ja.pdf
      - name: Add paper to the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mkdir -p doc/paper
          cp paper/index.html doc/paper/index.html
          cp paper/ruby-htslib.pdf doc/paper/ruby-htslib.pdf
          cp paper/ruby-htslib-ja.pdf doc/paper/ruby-htslib-ja.pdf
      - name: Upload paper artifact
        uses: actions/upload-artifact@v7
        with:
          name: ruby-htslib-paper
          path: |
            paper/ruby-htslib.pdf
            paper/ruby-htslib-ja.pdf
          if-no-files-found: error
      - name: Publish Documentation on GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
