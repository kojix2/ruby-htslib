name: test
on: 
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos", "windows"]
        ruby: ["3.4", "4.0"]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Install HTSlib (macos)
        if: ${{ matrix.os == 'macos' }}
        run: |
          brew install htslib pkg-config
      - name: Install HTSlib (ubuntu)
        if: ${{ matrix.os == 'ubuntu' }}
        run: |
          sudo apt update -y
          sudo apt install -yq libhts-dev pkg-config
      - name: Install HTSlib (windows)
        if: ${{ matrix.os == 'windows' }}
        run: |
          ridk exec bash -lc 'pacman -Sy --needed --noconfirm ${MINGW_PACKAGE_PREFIX}-htslib ${MINGW_PACKAGE_PREFIX}-pkgconf'
      - name: Install Ruby dependencies
        run: bundle install
      - name: Build and test local fixtures
        run: bundle exec rake test:local
      - name: Test remote URIs
        run: bundle exec rake test:remote
